<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>مغامرة المؤشر الذكي</title>
<style>
:root{
  --blue:#1769c9; --blue-d:#0e4a95; --sky:#e8f3ff; --ink:#12305c;
  --green:#18a058; --green-d:#0d7a40; --green-l:#dcf6e7;
  --orange:#ff8a1c; --orange-d:#c85f00; --orange-l:#fff0dd;
  --edge:#b9cfee; --edge-d:#97b4de;
  --u:clamp(36px, min(calc((100vw - 36px) / 19.4), calc((100vh - 520px) / 4)), 58px);
}
@media (max-width:900px){
  :root{ --u:min(64px, calc((100vw - 28px) / 14.3)); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--sky);color:var(--ink);overflow-x:hidden;min-height:100vh;
  font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic","Geeza Pro",Arial,sans-serif;
}
button{font-family:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:10px 14px 90px}

/* ---------- Banner ---------- */
.banner{background:var(--blue);color:#fff;border-radius:26px;padding:12px 20px 14px;text-align:center;border-bottom:8px solid var(--orange)}
.banner h1{margin:0;font-size:clamp(26px,4.4vw,42px);font-weight:900;line-height:1.25}
.bsub{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;margin-top:6px}
.lesson{background:#fff;color:var(--blue-d);font-weight:900;border-radius:99px;padding:3px 18px;font-size:clamp(16px,2.2vw,22px)}
.tagline{font-weight:700;font-size:clamp(15px,2vw,20px)}

/* ---------- Progress ---------- */
.prog{margin:12px 0;display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--edge);border-radius:20px;padding:8px 16px;flex-wrap:wrap}
.stageLbl{font-weight:900;font-size:clamp(17px,2.2vw,22px);white-space:nowrap}
.bar{flex:1;min-width:140px;height:20px;border-radius:99px;background:#dbe9fb;overflow:hidden;border:2px solid var(--edge)}
.fill{height:100%;width:0;background:var(--green);border-radius:99px;transition:width .5s}
.stars{display:flex;gap:4px;font-size:clamp(22px,3vw,30px);line-height:1}
.st{display:inline-block;color:var(--orange-d)}
.st.pop{animation:starpop .7s}
@keyframes starpop{0%{transform:scale(.3)}60%{transform:scale(1.5) rotate(12deg)}100%{transform:scale(1)}}

/* ---------- Task ---------- */
.task{display:flex;align-items:center;gap:16px;background:#fff;border:4px solid var(--blue);border-radius:26px;padding:12px 18px;margin-bottom:14px;flex-wrap:wrap}
.mascot{width:74px;flex:none}
.bubble{flex:1 1 320px;min-width:0}
.ttag{display:inline-block;background:var(--orange);color:#fff;font-weight:900;border-radius:99px;padding:2px 16px;font-size:clamp(15px,2vw,20px)}
.instr{font-size:clamp(22px,3.4vw,34px);font-weight:900;line-height:1.35;margin:4px 0 0}
.subi{font-size:clamp(15px,1.9vw,19px);color:#3d5b88;font-weight:600}
.msg{margin-top:8px;display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 14px;border-radius:16px;font-size:clamp(18px,2.5vw,24px);font-weight:800;border:3px solid transparent;visibility:hidden}
.msg.show{visibility:visible}
.msg.good{background:var(--green-l);border-color:var(--green);color:#0b6b37}
.msg.try{background:var(--orange-l);border-color:var(--orange);color:#8a4300}
.msg.info{background:#e8f1ff;border-color:var(--blue);color:var(--blue-d)}
.msg .ic{font-size:1.3em;flex:none}
.tools{display:flex;flex-direction:column;gap:10px;flex:none;min-width:190px}
.btn{min-height:56px;padding:0 22px;border:0;border-radius:18px;font-size:clamp(17px,2vw,21px);font-weight:900;cursor:pointer;color:#fff;touch-action:manipulation}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:4px solid #000;outline-offset:3px}
.btn.orange{background:var(--orange);box-shadow:0 5px 0 var(--orange-d)}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d);animation:nudge 1.2s infinite}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:none}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.miniWrap{flex:none;background:#f4f9ff;border:3px solid var(--edge);border-radius:18px;padding:6px 10px 8px;text-align:center}
.miniTitle{font-size:15px;font-weight:800;margin-bottom:2px}
.mini{--u:25px}
.mini .key{pointer-events:none}
.mini .top{font-size:calc(var(--u) * .42)}
.mini .main{font-size:calc(var(--u) * .52)}
.mini .shift .main{font-size:calc(var(--u) * .34)}

/* ---------- Editor window ---------- */
.win{max-width:820px;margin:0 auto 16px;background:#fff;border:6px solid var(--blue);border-radius:24px;overflow:hidden;position:relative;transition:border-color .2s,box-shadow .2s;-webkit-user-select:none;user-select:none}
.win.ok{border-color:var(--green);box-shadow:0 0 0 7px rgba(24,160,88,.28)}
.win.shake{animation:shake .35s}
.tbar{background:var(--blue);color:#fff;display:flex;align-items:center;gap:10px;padding:6px 14px;font-weight:800;transition:background .2s}
.win.ok .tbar{background:var(--green)}
.dots i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#fff;opacity:.75;margin-inline-end:5px}
.okbadge{margin-inline-start:auto;background:#fff;color:var(--green-d);border-radius:99px;padding:2px 14px;font-size:1.05rem;visibility:hidden}
.win.ok .okbadge{visibility:visible}
.page{position:relative;padding:14px 28px;min-height:calc(1.9em * 3 + 28px);font-size:clamp(26px,4.4vw,42px);line-height:1.9;font-weight:600;color:var(--ink);cursor:default}
.line{white-space:pre;direction:rtl;text-align:right}
.caret{position:absolute;width:6px;margin-left:-3px;background:var(--orange);border-radius:3px;box-shadow:0 0 0 2px #fff;pointer-events:none}
.caret.blink{animation:blink 1s infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.1}}
.ring{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:5px dashed var(--blue);background:rgba(23,105,201,.1);cursor:pointer;animation:ringpulse 1.1s infinite}
@keyframes ringpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.starpop{position:absolute;left:50%;top:50%;font-size:96px;line-height:1;opacity:0;transform:translate(-50%,-50%) scale(0);pointer-events:none}
.starpop.go{animation:bigstar 1.3s ease forwards}
@keyframes bigstar{
  0%{transform:translate(-50%,-50%) scale(0) rotate(-30deg);opacity:0}
  30%{transform:translate(-50%,-50%) scale(1.25) rotate(8deg);opacity:1}
  70%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}
  100%{transform:translate(-50%,-80%) scale(1);opacity:0}
}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ---------- Keyboard ---------- */
.kbarea{display:flex;justify-content:center}
.kb{direction:ltr}
.kball{display:flex;align-items:flex-start;justify-content:center;gap:calc(var(--u) * .7)}
.row{display:flex;justify-content:center}
.key{--w:1;position:relative;display:block;width:calc(var(--u) * var(--w));height:calc(var(--u) * .95);padding:0;margin:0;border:0;background:none;font:inherit;color:var(--ink);cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;outline:none}
.key:focus-visible .cap{outline:4px solid #000;outline-offset:2px}
.cap{position:absolute;inset:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:calc(var(--u) * .2);background:#fff;border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge-d);transition:transform .06s,box-shadow .06s,background .06s}
.top,.main{unicode-bidi:isolate;line-height:1;text-align:center}
.top{font-size:calc(var(--u) * .27);font-weight:700;opacity:.8;min-height:calc(var(--u) * .3);transition:transform .15s}
.main{font-size:calc(var(--u) * .46);font-weight:800}
.shift .cap,.del .cap{background:var(--orange);border-color:var(--orange-d);box-shadow:0 5px 0 var(--orange-d);color:#fff}
.shift .main,.del .main{font-size:calc(var(--u) * .3);font-family:Arial,sans-serif}
.arrow .cap{background:var(--blue);border-color:var(--blue-d);box-shadow:0 5px 0 var(--blue-d);color:#fff}
.arrow .main{font-size:calc(var(--u) * .8);font-family:Arial,sans-serif}
.key.down .cap{transform:translateY(5px);box-shadow:0 0 0 transparent;background:#ffe39a;border-color:var(--orange-d);color:var(--ink);outline:4px solid #ffd23f;outline-offset:1px}
.shift.down .cap,.del.down .cap{background:var(--orange-d);color:#fff}
.arrow.down .cap{background:var(--blue-d);color:#fff}
.key.on .cap{transform:translateY(5px);box-shadow:0 0 0 transparent;outline:4px dashed var(--blue);outline-offset:2px;background:var(--orange-d);color:#fff}
.key.bad .cap{animation:shake .38s;border-color:#d1432e;background:#ffe1dc;color:var(--ink)}
.key.glow .cap{animation:glow .9s infinite;border-color:var(--orange-d)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,138,28,0),0 5px 0 var(--orange-d)}50%{box-shadow:0 0 0 9px rgba(255,138,28,.6),0 5px 0 var(--orange-d)}}
.kb.shifted .top{opacity:1;color:var(--orange-d);font-weight:900;transform:scale(1.35)}
.kb.shifted .main{opacity:.4}
.cluster{display:grid;direction:ltr;grid-template-columns:repeat(3,calc(var(--u) * 1.5));grid-template-rows:calc(var(--u) * .95) calc(var(--u) * 1.15) calc(var(--u) * 1.15)}
.cluster .key{width:100%;height:100%}
.k-del{grid-column:1 / span 3;grid-row:1}
.k-up{grid-column:2;grid-row:2}
.k-left{grid-column:1;grid-row:3}
.k-down{grid-column:2;grid-row:3}
.k-right{grid-column:3;grid-row:3}
@media (max-width:900px){
  .kball{flex-direction:column;align-items:center;gap:calc(var(--u) * .3)}
}

/* ---------- Teacher mode ---------- */
.tbtn{position:fixed;left:10px;bottom:10px;z-index:30;background:#fff;border:2px solid var(--edge);color:var(--ink);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:700;opacity:.8;cursor:pointer}
.tbtn:hover,.tbtn:focus-visible{opacity:1}
.panel{position:fixed;left:10px;bottom:56px;z-index:40;width:min(94vw,370px);max-height:78vh;overflow:auto;background:#fff;border:4px solid var(--blue);border-radius:20px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.panel h3{margin:0 0 8px;font-size:20px}
.panel .info{font-size:16px;line-height:1.7;margin-bottom:8px;font-weight:600}
.panel ul{list-style:none;margin:0 0 10px;padding:0;font-size:16px;line-height:1.8}
.panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.pbtn{min-height:46px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;font-size:15px;cursor:pointer;padding:4px 8px}
.pbtn.warn{background:var(--orange-d)}
.pbtn.full{grid-column:1 / span 2}
.pbtn:disabled{opacity:.4;cursor:default}

/* ---------- Celebration ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(18,48,92,.78);display:flex;align-items:center;justify-content:center;padding:14px}
.celcard{position:relative;overflow:hidden;background:#fff;border:8px solid var(--orange);border-radius:30px;padding:22px 26px;width:min(96vw,560px);text-align:center;max-height:96vh;overflow-y:auto}
.celcard h2{margin:0 0 4px;font-size:clamp(26px,5vw,38px);font-weight:900;color:var(--blue-d);position:relative}
.celcard .big{font-size:clamp(20px,3.4vw,26px);font-weight:800;margin:0 0 8px;position:relative}
.celcard ul{list-style:none;margin:0 auto 10px;padding:0;display:inline-block;text-align:right;font-size:clamp(18px,2.8vw,23px);font-weight:700;line-height:1.9;position:relative}
.celcard .score{display:block;background:var(--green-l);border:3px solid var(--green);color:#0b6b37;border-radius:16px;font-weight:900;font-size:clamp(24px,4vw,32px);padding:6px;margin:6px 0 14px;position:relative}
.celbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;position:relative}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-24px;width:10px;height:16px;opacity:.95;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(120vh) rotate(720deg)}}

@media (max-width:700px){
  .tools{flex-direction:row;width:100%}
  .tools .btn{flex:1;padding:0 8px}
  .mascot{width:58px}
  .page{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .starpop.go{animation:none;opacity:1;transform:translate(-50%,-50%) scale(1)}
}
</style>
</head>
<body>
<noscript><p style="padding:20px;font-size:22px">يحتاج هذا النشاط إلى تفعيل JavaScript في المتصفح.</p></noscript>
<div class="wrap">

  <header class="banner">
    <h1>مغامرة المؤشر الذكي</h1>
    <div class="bsub">
      <span class="lesson">درس: التحرك داخل النص</span>
      <span class="tagline">ساعد المؤشر على الوصول إلى المكان الصحيح وإصلاح النص!</span>
    </div>
  </header>

  <section class="prog" aria-label="التقدم">
    <div class="stageLbl" id="stageLbl">المرحلة: 1 من 5</div>
    <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div>
    <div class="stars" id="stars" aria-label="النجوم"></div>
  </section>

  <section class="task" aria-label="المهمة">
    <svg class="mascot" viewBox="0 0 80 100" aria-hidden="true">
      <rect x="10" y="22" width="60" height="70" rx="22" fill="#1769c9"/>
      <rect x="33" y="3" width="14" height="26" rx="7" fill="#ff8a1c"/>
      <circle cx="30" cy="52" r="10" fill="#fff"/><circle cx="50" cy="52" r="10" fill="#fff"/>
      <circle cx="32" cy="54" r="5" fill="#12305c"/><circle cx="52" cy="54" r="5" fill="#12305c"/>
      <path d="M28 72 Q40 84 52 72" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="bubble">
      <span class="ttag" id="ttag">المهمة 1: حرّك المؤشر</span>
      <p class="instr" id="instr"></p>
      <div class="subi" id="subi"></div>
      <div class="msg" id="msg" role="status" aria-live="polite"><span class="ic" id="msgIc"></span><span id="msgTx"></span></div>
    </div>
    <div class="tools">
      <button class="btn orange" id="hintBtn" type="button">أحتاج تلميحًا 💡</button>
      <button class="btn blue" id="retryBtn" type="button">إعادة المحاولة 🔄</button>
      <button class="btn green" id="nextBtn" type="button" hidden>المرحلة التالية ◀</button>
    </div>
    <div class="miniWrap" id="miniWrap" hidden>
      <div class="miniTitle">لوحة المفاتيح العربية</div>
      <div id="miniKb" class="mini"></div>
    </div>
  </section>

  <section class="win" id="win" aria-label="محرر النصوص">
    <div class="tbar"><span class="dots"><i></i><i></i><i></i></span><span>مستند نصي</span><span class="okbadge" id="okbadge">✔ صحيح</span></div>
    <div class="page" id="page">
      <div id="lines"></div>
      <div class="caret blink" id="caret"></div>
      <div class="ring" id="ring" hidden title="مؤشر الكتابة"></div>
      <div class="starpop" id="starpop">⭐</div>
    </div>
  </section>

  <section class="kbarea" id="kbArea" aria-label="لوحة المفاتيح"></section>
</div>

<button class="tbtn" id="tBtn" type="button">وضع المعلم</button>
<div class="panel" id="panel" hidden>
  <h3>وضع المعلم</h3>
  <div class="info" id="pInfo"></div>
  <ul id="pSkills"></ul>
  <div class="grid">
    <button class="pbtn" id="pPrev" type="button">المرحلة السابقة</button>
    <button class="pbtn" id="pNext" type="button">المرحلة التالية</button>
    <button class="pbtn" id="pRepeat" type="button">إعادة المرحلة الحالية</button>
    <button class="pbtn warn" id="pRestart" type="button">إعادة تشغيل النشاط</button>
    <button class="pbtn full" id="pClose" type="button">إغلاق</button>
  </div>
</div>

<div class="overlay" id="cel" hidden role="dialog" aria-modal="true" aria-label="الاحتفال">
  <div class="celcard">
    <div class="confetti" id="confetti"></div>
    <h2>🎉 أحسنت يا بطل المؤشر! 🎉</h2>
    <p class="big">أكملت جميع المهام بنجاح</p>
    <ul id="sum"></ul>
    <span class="score" id="score">النتيجة: 5/5</span>
    <div class="celbtns">
      <button class="btn blue" id="again" type="button">تدرب مرة أخرى</button>
      <button class="btn orange" id="newch" type="button">ابدأ تحديًا جديدًا</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =====================================================
   لوحة المفاتيح العربية (تخطيط Arabic 101)
   [رمز المفتاح الفعلي, الحرف, الحرف مع Shift]
   ===================================================== */
var DOT = '\u25CC';
var KB = [
  [['KeyQ','ض',DOT+'\u064E'],['KeyW','ص',DOT+'\u064B'],['KeyE','ث',DOT+'\u064F'],['KeyR','ق',DOT+'\u064C'],['KeyT','ف','لإ'],['KeyY','غ','إ'],['KeyU','ع','\u2018'],['KeyI','ه','÷'],['KeyO','خ','×'],['KeyP','ح','؛'],['BracketLeft','ج','<'],['BracketRight','د','>']],
  [['KeyA','ش',DOT+'\u0650'],['KeyS','س',DOT+'\u064D'],['KeyD','ي',']'],['KeyF','ب','['],['KeyG','ل','لأ'],['KeyH','ا','أ'],['KeyJ','ت','ـ'],['KeyK','ن','،'],['KeyL','م','/'],['Semicolon','ك',':'],['Quote','ط','"']],
  [['KeyZ','ئ','~'],['KeyX','ء',DOT+'\u0652'],['KeyC','ؤ','}'],['KeyV','ر','{'],['KeyB','لا','لآ'],['KeyN','ى','آ'],['KeyM','ة','\u2019'],['Comma','و',','],['Period','ز','.'],['Slash','ظ','؟']]
];
function strip(s){ return s.split(DOT).join(''); }
var CHAR = {}, BYCHAR = {};
KB.forEach(function(row){ row.forEach(function(k){
  var n = strip(k[1]), s = strip(k[2]);
  CHAR[k[0]] = {n:n, s:s};
  if(!BYCHAR[n]) BYCHAR[n] = {code:k[0], shift:false};
  if(!BYCHAR[s]) BYCHAR[s] = {code:k[0], shift:true};
}); });
var ARROWS = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];

/* =====================================================
   المراحل والمهام
   ===================================================== */
var OKMOVE = 'أحسنت! وصلت إلى المكان الصحيح ⭐';
var L3 = ['وطني عمان','وطن السلام','أنا مواطن رقمي'];

var STAGES = [
  { title:'المهمة 1: حرّك المؤشر', lines:L3, caret:[0,0], steps:[
    {id:'1t', type:'tap',  text:'أين مؤشر الكتابة؟ اضغط عليه!', ok:'أحسنت! هذا هو مؤشر الكتابة ⭐'},
    {id:'1a', type:'move', text:'حرّك المؤشر إلى نهاية السطر الأول.', sub:'استخدم مفاتيح الأسهم فقط.', target:{l:0,c:9}, ok:OKMOVE},
    {id:'1b', type:'move', text:'حرّك المؤشر إلى السطر الثاني.', target:{l:1}, ok:OKMOVE},
    {id:'1c', type:'move', text:'حرّك المؤشر إلى بداية كلمة «السلام».', target:{l:1,c:4}, ok:OKMOVE},
    {id:'1d', type:'move', text:'حرّك المؤشر إلى كلمة «رقمي».', target:{l:2,cmin:10,cmax:14}, ok:'أصبحت خبيرًا في تحريك المؤشر! ⭐'}
  ]},
  { title:'المهمة 2: أصلح الكلمة', lines:L3, caret:[0,0], steps:[
    {id:'2a', type:'move', text:'حرّك المؤشر إلى بداية كلمة «رقمي».', sub:'نريد تغيير كلمة «رقمي» إلى «أمين».', target:{l:2,c:10}, ok:OKMOVE},
    {id:'2b', type:'edit', text:'استخدم مفتاح Delete لحذف كلمة «رقمي».', sub:'Delete يحذف الحرف الذي على يسار المؤشر.', edit:{l:2,prefix:'أنا مواطن ',suffix:'',goal:'',kind:'delete'}, ok:'جميل! حذفت الكلمة. الآن اكتب الكلمة الجديدة.'},

/* =====================================================
   عناصر الصفحة
   ===================================================== */
function $(id){ return document.getElementById(id); }

/* ---------- بناء لوحة المفاتيح ---------- */
function keyEl(code, top, main, cls, w, mini){
  var k = mk(mini ? 'div' : 'button', 'key ' + (cls || ''));
  if(!mini){ k.type = 'button'; k.tabIndex = -1; }
  k.setAttribute('data-code', code);
  k.style.setProperty('--w', w);
  var cap = mk('span', 'cap');
  if(top) cap.appendChild(mk('span', 'top', top));
  else if(cls.indexOf('shift') < 0 && cls.indexOf('del') < 0 && cls.indexOf('arrow') < 0) cap.appendChild(mk('span', 'top', ''));
  cap.appendChild(mk('span', 'main', main));
  k.appendChild(cap);
  return k;
}
function buildKB(root, mini){
  root.textContent = '';
  var kb = mk('div', 'kb' + (mini ? '' : ' kbmain'));
  var all = mk('div', 'kball');
  var main = mk('div', 'kmain');
  KB.forEach(function(row, ri){
    var r = mk('div', 'row');
    if(ri === 2) r.appendChild(keyEl('ShiftLeft', '', '⇧ Shift', 'shift', 2, mini));
    row.forEach(function(k){ r.appendChild(keyEl(k[0], k[2], k[1], '', 1, mini)); });
    if(ri === 2) r.appendChild(keyEl('ShiftRight', '', 'Shift ⇧', 'shift', 2, mini));
    main.appendChild(r);
  });
  all.appendChild(main);
  if(!mini){
    var cl = mk('div', 'cluster');
    cl.appendChild(keyEl('Delete', '', 'Delete', 'del k-del', 1, false));
    cl.appendChild(keyEl('ArrowUp', '', '↑', 'arrow k-up', 1, false));
    cl.appendChild(keyEl('ArrowLeft', '', '←', 'arrow k-left', 1, false));
    cl.appendChild(keyEl('ArrowDown', '', '↓', 'arrow k-down', 1, false));
    cl.appendChild(keyEl('ArrowRight', '', '→', 'arrow k-right', 1, false));
    all.appendChild(cl);
  }
  kb.appendChild(all);
  root.appendChild(kb);
}

/* تأثيرات المفاتيح */
function keysFor(code){ return document.querySelectorAll('.key[data-code="' + code + '"]'); }
function flash(code, cls, ms){
  var ks = keysFor(code);
  for(var i = 0; i < ks.length; i++){ ks[i].classList.add(cls); }
  setTimeout(function(){ for(var j = 0; j < ks.length; j++) ks[j].classList.remove(cls); }, ms || 380);
}
var glowTimer = null;
function clearGlow(){
  var g = document.querySelectorAll('.key.glow');
  for(var i = 0; i < g.length; i++) g[i].classList.remove('glow');
  if(glowTimer){ clearTimeout(glowTimer); glowTimer = null; }
}
function setGlow(codes){
  clearGlow();
  codes.forEach(function(c){ var ks = keysFor(c); for(var i = 0; i < ks.length; i++) ks[i].classList.add('glow'); });
  glowTimer = setTimeout(clearGlow, 9000);
}
function syncShift(){
  var on = S.latched || S.phys;
  ['ShiftLeft','ShiftRight'].forEach(function(c){
    var ks = keysFor(c);
    for(var i = 0; i < ks.length; i++) ks[i].classList.toggle('on', on);
  });
  var kbs = document.querySelectorAll('.kb');
  for(var j = 0; j < kbs.length; j++) kbs[j].classList.toggle('shifted', on);
}

/* ---------- الرسائل ---------- */
function showMsg(kind, text){
  msgEl.className = 'msg show ' + kind;
  $('msgIc').textContent = kind === 'good' ? '✔' : (kind === 'try' ? '💡' : '👉');
  $('msgTx').textContent = text;
}
function clearMsg(){ msgEl.className = 'msg'; $('msgTx').textContent = ''; }
function shake(){ win.classList.remove('shake'); void win.offsetWidth; win.classList.add('shake'); setTimeout(function(){ win.classList.remove('shake'); }, 400); }
function miss(text, code){
  S.attempts[S.stage]++;
  showMsg('try', text);
  if(code) flash(code, 'bad', 400);
  shake();
  save();
}

/* =====================================================
   المحرر: عرض النص وموضع المؤشر
   ===================================================== */
function renderLines(){
  linesEl.textContent = '';
  lineEls = S.lines.map(function(t){
    var d = mk('div', 'line'); d.dir = 'rtl'; d.textContent = t; linesEl.appendChild(d); return d;
  });
}
function firstRect(rg){ var rs = rg.getClientRects(); return rs.length ? rs[0] : rg.getBoundingClientRect(); }
/* موضع المؤشر (l = السطر، c = الموضع المنطقي من بداية السطر أي من اليمين) */
function caretXY(l, c){
  var el = lineEls[l], pr = pageEl.getBoundingClientRect(), lr = el.getBoundingClientRect();
  var text = S.lines[l], node = el.firstChild, x;
  if(!text.length || !node){
    x = lr.right - pr.left;
  } else {
    var rg = document.createRange();
    if(c > 0){ rg.setStart(node, c - 1); rg.setEnd(node, c); x = firstRect(rg).left - pr.left; }
    else { rg.setStart(node, 0); rg.setEnd(node, 1); x = firstRect(rg).right - pr.left; }
  }
  return {x:x, y:lr.top - pr.top + lr.height * 0.08, h:lr.height * 0.84};
}
function placeCaret(){
  if(!lineEls.length) return;
  var p = caretXY(S.caret.l, S.caret.c);
  caretEl.style.left = p.x + 'px'; caretEl.style.top = p.y + 'px'; caretEl.style.height = p.h + 'px';
  ringEl.style.left = p.x + 'px'; ringEl.style.top = (p.y + p.h / 2) + 'px';
  caretEl.classList.remove('blink'); void caretEl.offsetWidth; caretEl.classList.add('blink');
}
function nearestCol(l, gx){
  var best = 0, bd = 1e9, n = S.lines[l].length;
  for(var c = 0; c <= n; c++){
    var d = Math.abs(caretXY(l, c).x - gx);
    if(d < bd - 0.5){ bd = d; best = c; }
  }
  return best;
}

/* =====================================================
   منطق المهام
   ===================================================== */
function midOf(e){
  var line = S.lines[e.l], ms = e.prefix.length, me = line.length - e.suffix.length;
  return {line:line, ms:ms, me:me, mid:line.slice(ms, me)};
}
function needDelete(e, mid){
  if(e.kind === 'delete') return mid.length > e.goal.length;
  if(e.kind === 'replace') return mid.length > 0 && e.goal.indexOf(mid) !== 0;
  return false;
}
function stepDone(st){
  if(st.type === 'move'){
    var t = st.target, c = S.caret;
    if(c.l !== t.l) return false;
    if(t.c !== undefined) return c.c === t.c;
    if(t.cmin !== undefined) return c.c >= t.cmin && c.c <= t.cmax;
    return true;
  }
  if(st.type === 'edit'){ var e = st.edit; return S.lines[e.l] === e.prefix + e.goal + e.suffix; }
  return false;
}
/* الهدف الحالي للمؤشر (يُستعمل لمعرفة اتجاه الحركة الصحيح) */
function navTarget(st){
  if(st.type === 'move') return st.target;
  if(st.type === 'edit'){
    var m = midOf(st.edit);
    if(needDelete(st.edit, m.mid)) return {l:st.edit.l, cmin:m.ms, cmax:m.me - 1};
    return {l:st.edit.l, c:m.me};
  }
  return null;
}
function navDist(st, car){
  var t = navTarget(st);
  if(!t) return 0;
  var ld = Math.abs(car.l - t.l);
  if(ld) return ld * 1000;
  var x = caretXY(car.l, car.c).x;
  if(t.c !== undefined) return Math.abs(x - caretXY(t.l, t.c).x);
  if(t.cmin !== undefined){
    if(car.c >= t.cmin && car.c <= t.cmax) return 0;
    return Math.min(Math.abs(x - caretXY(t.l, t.cmin).x), Math.abs(x - caretXY(t.l, t.cmax).x));
  }
  return 0;
}
function suggestArrow(st){
  var t = navTarget(st);
  if(!t) return null;
  if(S.caret.l !== t.l) return t.l > S.caret.l ? 'ArrowDown' : 'ArrowUp';
  var x = caretXY(S.caret.l, S.caret.c).x, tx;
  if(t.c !== undefined) tx = caretXY(t.l, t.c).x;
  else if(t.cmin !== undefined){
    var a = caretXY(t.l, t.cmin).x, b = caretXY(t.l, t.cmax).x;
    tx = Math.abs(x - a) < Math.abs(x - b) ? a : b;
  } else return null;
  return tx < x ? 'ArrowLeft' : 'ArrowRight';
}

/* ---------- الأسهم ---------- */
function arrow(code){
  var st = curStep();
  if(st.type === 'tap'){ miss('أولًا اضغط على المؤشر الوامض.', code); return; }
  var old = {l:S.caret.l, c:S.caret.c}, oldD = navDist(st, old);
  var nl = old.l, nc = old.c, len = S.lines[old.l].length;
  if(code === 'ArrowLeft'){ if(nc < len) nc++; }
  else if(code === 'ArrowRight'){ if(nc > 0) nc--; }
  else {
    if(S.goalX == null) S.goalX = caretXY(old.l, old.c).x;
    var tl = old.l + (code === 'ArrowDown' ? 1 : -1);
    if(tl >= 0 && tl < S.lines.length){ nl = tl; nc = nearestCol(tl, S.goalX); }
  }
  if(code === 'ArrowLeft' || code === 'ArrowRight') S.goalX = null;
  if(nl === old.l && nc === old.c){ miss('لا يمكن التحرك في هذا الاتجاه. جرّب سهمًا آخر.', code); return; }
  S.caret = {l:nl, c:nc};
  placeCaret();
  S.hint = 0;
  if(navDist(st, S.caret) > oldD){ S.attempts[S.stage]++; showMsg('try', pick(WRONG_MOVE)); save(); }
  else clearMsg();
  if(stepDone(st)) complete(st);
}

/* ---------- Delete ---------- */
function del(){
  var st = curStep();
  if(st.type !== 'edit'){ miss(st.type === 'tap' ? 'أولًا اضغط على المؤشر الوامض.' : 'الآن نحرّك المؤشر فقط. استخدم الأسهم.', 'Delete'); return; }
  var e = st.edit, m = midOf(e), c = S.caret.c;
  if(S.caret.l === e.l && c >= m.line.length){ miss('لا يوجد حرف بعد المؤشر. جرّب سهمًا آخر.', 'Delete'); return; }
  if(S.caret.l !== e.l || c < m.ms || c >= m.me){ miss(pick(WRONG_PLACE), 'Delete'); return; }
  if(!needDelete(e, m.mid)){ miss('لا نحتاج إلى حذف شيء الآن.', 'Delete'); return; }
  S.lines[e.l] = m.line.slice(0, c) + m.line.slice(c + 1);
  S.goalX = null; S.hint = 0;
  renderLines(); placeCaret();
  if(stepDone(st)) complete(st); else showMsg('good', pick(SUCCESS));
}

/* ---------- كتابة حرف أو علامة ---------- */
function typeKey(code, shift){
  var st = curStep(), mp = CHAR[code], ch = shift ? mp.s : mp.n;
  if(st.type !== 'edit'){ miss(st.type === 'tap' ? 'أولًا اضغط على المؤشر الوامض.' : 'الآن نحرّك المؤشر فقط. استخدم الأسهم.', code); return; }
  var e = st.edit, m = midOf(e), c = S.caret.c;
  if(S.caret.l !== e.l || c < m.ms || c > m.me){ miss(pick(WRONG_PLACE), code); return; }
  if(!(e.kind === 'insert' || e.kind === 'replace')){ miss('لا نحتاج إلى كتابة شيء الآن.', code); return; }
  if(e.goal.indexOf(m.mid) !== 0 || m.mid.length >= e.goal.length){ miss('أولًا أزل ما لا نحتاج إليه، ثم اكتب.', code); return; }
  if(c !== m.me){ miss(pick(WRONG_PLACE), code); return; }
  var need = e.goal.charAt(m.mid.length);
  if(ch !== need){
    var info = BYCHAR[need];
    if(S.stage < 4 && !S.bonus && info && info.code === code && info.shift && !shift) miss('اقتربت! هذا هو المفتاح الصحيح، لكنه يحتاج إلى مفتاح آخر معه.', code);
    else miss(pick(WRONG_KEY), code);
    return;
  }
  S.lines[e.l] = m.line.slice(0, c) + ch + m.line.slice(c);
  S.caret.c = c + 1; S.goalX = null; S.hint = 0;
  renderLines(); placeCaret();
  if(stepDone(st)) complete(st); else showMsg('good', pick(SUCCESS));
}

/* ---------- توجيه المفاتيح ---------- */
function handle(code, shift){
  if(S.locked || S.over || !S.def) return;
  clearGlow();
  if(ARROWS.indexOf(code) >= 0) arrow(code);
  else if(code === 'Delete') del();
  else if(CHAR[code]) typeKey(code, shift);
  else miss('هذا المفتاح ليس مطلوبًا الآن.', code);
  S.latched = false; syncShift();
}
function pressVirtual(code){
  if($('panel').hidden === false || $('cel').hidden === false) return;
  if(code === 'ShiftLeft' || code === 'ShiftRight'){
    if(S.locked || S.over) return;
    S.latched = !S.latched; syncShift(); shiftNote(); return;
  }
  flash(code, 'down', 170);
  handle(code, S.latched || S.phys);
}
/* تشجيع بسيط عند الضغط على Shift في المراحل التدريبية */
function expectedChar(){
  if(!S.def) return null;
  var st = curStep();
  if(!st || st.type !== 'edit') return null;
  var e = st.edit, m = midOf(e);
  if(!(e.kind === 'insert' || e.kind === 'replace')) return null;
  if(e.goal.indexOf(m.mid) !== 0 || m.mid.length >= e.goal.length) return null;
  return e.goal.charAt(m.mid.length);
}
function shiftNote(){
  if(S.locked || S.over || S.stage >= 4 || S.bonus) return;
  if(!(S.latched || S.phys)) return;
  var ch = expectedChar(), info = ch ? BYCHAR[ch] : null;
  if(info && info.shift) showMsg('info', 'جيد! Shift جاهز. الآن اضغط المفتاح المناسب.');
}

/* لوحة المفاتيح الحقيقية */
window.addEventListener('keydown', function(e){
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  var code = e.code;
  if(code === 'ShiftLeft' || code === 'ShiftRight'){
    if(!S.phys){ S.phys = true; syncShift(); shiftNote(); }
    return;
  }
  var known = ARROWS.indexOf(code) >= 0 || code === 'Delete' || code === 'Space' || code === 'Backspace' || CHAR[code];
  if(!known) return;
  e.preventDefault();
  if($('panel').hidden === false || $('cel').hidden === false) return;
  if(e.repeat && ARROWS.indexOf(code) < 0) return;
  flash(code, 'down', 170);
  handle(code, e.shiftKey || S.latched);
});
window.addEventListener('keyup', function(e){
  if(e.code === 'ShiftLeft' || e.code === 'ShiftRight'){ S.phys = false; syncShift(); }
});
window.addEventListener('blur', function(){ S.phys = false; syncShift(); });

/* لوحة المفاتيح الافتراضية (نقر / لمس) */
kbArea.addEventListener('pointerdown', function(e){
  var k = e.target.closest ? e.target.closest('.key') : null;
  if(!k) return;
  e.preventDefault();
  pressVirtual(k.getAttribute('data-code'));
});

/* النقر داخل النص لا يحرّك المؤشر */
pageEl.addEventListener('pointerdown', function(e){
  if(e.target.closest && e.target.closest('#ring')) return;
  if(S.locked || S.over || !S.def) return;
  var st = curStep();
  showMsg('info', st.type === 'tap' ? 'اضغط على المؤشر الوامض.' : 'استخدم مفاتيح الأسهم لتحريك المؤشر.');
});
pageEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });
ringEl.addEventListener('pointerdown', function(e){
  e.preventDefault(); e.stopPropagation();
  if(S.locked || S.over || !S.def) return;
  var st = curStep();
  if(st.type === 'tap') complete(st);
});

/* =====================================================
   النجاح والانتقال
   ===================================================== */
function complete(st){
  S.locked = true; clearGlow();
  if(!S.bonus) S.done[st.id] = true;
  var last = S.step === S.def.steps.length - 1;
  if(last && !S.bonus) S.stars[S.stage] = true;
  save();
  updateProgress(last && !S.bonus ? S.stage : -1);
  showMsg('good', st.ok || pick(SUCCESS));
  win.classList.add('ok');
  var sp = $('starpop'); sp.classList.remove('go'); void sp.offsetWidth; sp.classList.add('go');
  later(function(){ sp.classList.remove('go'); }, 1400);
  hintBtn.disabled = true; retryBtn.disabled = true;
  if(last){
    if(S.stage === 4 || S.bonus){ later(showCelebrate, 1900); }
    else { nextBtn.hidden = false; }
  } else {
    var k = S.step + 1;
    later(function(){ startStep(k); }, 1700);
  }
}
function startStage(i){
  clearTimers();
  S.stage = i; S.def = stageDef(i);
  S.lines = S.def.lines.slice(); S.caret = {l:S.def.caret[0], c:S.def.caret[1]};
  S.over = false; $('cel').hidden = true;
  renderLines();
  startStep(0);
  save();
}
function startStep(k){
  clearTimers();
  S.step = k;
  var st = S.def.steps[k];
  if(st.setLines){ S.lines = st.setLines.slice(); S.caret = {l:st.setCaret[0], c:st.setCaret[1]}; renderLines(); }
  S.goalX = null; S.hint = 0; S.locked = false; S.latched = false; syncShift();
  S.snap = {lines:S.lines.slice(), caret:{l:S.caret.l, c:S.caret.c}};
  win.classList.remove('ok'); clearGlow(); clearMsg();
  nextBtn.hidden = true; hintBtn.disabled = false; retryBtn.disabled = false;
  renderTask(); placeCaret(); updateProgress(-1);
}
function renderTask(){
  var st = curStep();
  $('ttag').textContent = S.bonus ? 'تحدٍّ جديد: المؤشر الذكي' : S.def.title;
  $('instr').textContent = st.text;
  $('subi').textContent = st.sub || '';
  ringEl.hidden = st.type !== 'tap';
  $('miniWrap').hidden = !(S.stage === 2 && !S.bonus);
}
function retry(){
  if(S.locked || S.over || !S.snap) return;
  S.lines = S.snap.lines.slice(); S.caret = {l:S.snap.caret.l, c:S.snap.caret.c};
  S.goalX = null; S.hint = 0; clearGlow();
  renderLines(); placeCaret();
  showMsg('info', 'لا بأس! بدأنا هذه الخطوة من جديد.');
}

/* ---------- التلميحات ---------- */
function hintFor(st){
  var n = S.hint, lvl5 = (S.stage === 4);
  if(st.type === 'tap') return {t:'المؤشر هو الخط البرتقالي الوامض داخل النص.', glow:[]};
  var tgt = navDist(st, S.caret) > 0;
  if(tgt){
    if(n === 1) return {t:'أي سهم سيأخذ المؤشر إلى المكان المطلوب؟', glow:[]};
    if(n === 2) return {t:'المؤشر يتحرك في اتجاه السهم الذي تضغطه.', glow:[]};
    if(lvl5) return {t:'انظر أين تريد أن يقف المؤشر، ثم حرّكه خطوة خطوة.', glow:[]};
    var a = suggestArrow(st);
    return {t:'انظر إلى السهم المضيء.', glow:a ? [a] : []};
  }
  var e = st.edit, m = midOf(e);
  if(needDelete(e, m.mid)){
    if(!lvl5){
      if(n === 1) return {t:'Delete يحذف الحرف الذي على يسار المؤشر.', glow:[]};
      return {t:'اضغط المفتاح المضيء.', glow:['Delete']};
    }
    return {t:n === 1 ? 'هل يوجد شيء تريد إزالته؟' : (n === 2 ? 'أي مفتاح يزيل حرفًا؟' : 'فكّر في المفتاح المناسب للإزالة.'), glow:[]};
  }
  var ch = e.goal.charAt(m.mid.length), info = BYCHAR[ch];
  if(info && info.shift){
    if(!lvl5){
      if(n === 1) return {t:'ابحث عن الحرف الموجود أعلى المفتاح.', glow:[]};
      if(n === 2) return {t:'استخدم Shift مع المفتاح المناسب.', glow:[]};
      return {t:'اضغط المفتاحين المضيئين معًا.', glow:['ShiftLeft','ShiftRight',info.code]};
    }
    return {t:n === 1 ? 'ابحث على لوحة المفاتيح عن الحرف أو العلامة المطلوبة.' : (n === 2 ? 'بعض الحروف والعلامات موجودة أعلى المفتاح.' : 'انظر جيدًا إلى أعلى المفاتيح.'), glow:[]};
  }
  if(info){
    if(n === 1) return {t:'ابحث عن الحرف «' + ch + '» على لوحة المفاتيح.', glow:[]};
    return {t:'هذا هو المفتاح المضيء.', glow:[info.code]};
  }
  return {t:'فكّر مرة أخرى، أنت قريب!', glow:[]};
}
hintBtn.addEventListener('click', function(){
  if(S.locked || S.over || !S.def) return;
  S.hint++;
  var h = hintFor(curStep());
  showMsg('try', h.t);
  if(h.glow && h.glow.length) setGlow(h.glow);
  hintBtn.blur();
});
retryBtn.addEventListener('click', function(){ retry(); retryBtn.blur(); });
nextBtn.addEventListener('click', function(){ nextBtn.blur(); startStage(S.stage + 1); });

/* =====================================================
   التقدم والنجوم
   ===================================================== */
var lastStarCount = 0;
function updateProgress(popIdx){
  $('stageLbl').textContent = S.bonus ? 'تحدٍّ جديد ⭐' : 'المرحلة: ' + (S.stage + 1) + ' من 5';
  var n = Object.keys(S.done).length;
  var pct = S.bonus ? 100 : Math.min(100, Math.round(n / TOTAL_STEPS * 100));
  $('fill').style.width = pct + '%';
  $('bar').setAttribute('aria-valuenow', pct);
  var box = $('stars'); box.textContent = '';
  for(var i = 0; i < 5; i++){
    var s = mk('span', 'st' + (i === popIdx ? ' pop' : ''), S.stars[i] ? '⭐' : '☆');
    s.setAttribute('aria-label', S.stars[i] ? 'نجمة مكتسبة' : 'نجمة لم تُكتسب');
    box.appendChild(s);
  }
}

/* =====================================================
   شاشة الاحتفال
   ===================================================== */
function showCelebrate(){
  S.over = true; S.locked = true;
  var items = [
    ['أستطيع تحريك المؤشر.', S.stars[0]],
    ['أستطيع استخدام مفاتيح الأسهم.', !!S.done['2a'] || S.stars[0]],
    ['أستطيع استخدام Shift.', S.stars[2]],
    ['أستطيع حذف حرف وتعديل النص.', S.stars[1]],
    ['أستطيع إضافة علامة ترقيم.', S.stars[3]]
  ];
  var ul = $('sum'); ul.textContent = '';
  items.forEach(function(it){ ul.appendChild(mk('li', '', (it[1] ? '✓ ' : '○ ') + it[0])); });
  var score = S.stars.filter(Boolean).length;
  $('score').textContent = 'النتيجة: ' + score + '/5';
  var cf = $('confetti'); cf.textContent = '';
  var cols = ['#ff8a1c','#1769c9','#18a058','#ffd23f','#e8478b'];
  for(var i = 0; i < 40; i++){
    var p = mk('i'); p.style.left = (Math.random() * 100) + '%';
    p.style.background = cols[i % cols.length];
    p.style.animationDuration = (2.2 + Math.random() * 2.4) + 's';
    p.style.animationDelay = (Math.random() * 1.2) + 's';
    cf.appendChild(p);
  }
  $('cel').hidden = false;
}
function restartAll(){
  S.stars = [false,false,false,false,false]; S.done = {}; S.attempts = [0,0,0,0,0];
  S.bonus = false; S.v = 0;
  try{ sessionStorage.removeItem(STORE); }catch(e){}
  startStage(0);
}
$('again').addEventListener('click', function(){ $('again').blur(); restartAll(); });
$('newch').addEventListener('click', function(){
  $('newch').blur();
  S.v = (S.v + 1) % V5.length; S.bonus = true;
  startStage(4);
});

/* =====================================================
   وضع المعلم
   ===================================================== */
var SKILLS = [
  ['التعرف إلى مؤشر الكتابة', function(){ return !!S.done['1t']; }],
  ['تحريك المؤشر بمفاتيح الأسهم', function(){ return S.stars[0]; }],
  ['الوصول بالمؤشر إلى مكان محدد', function(){ return !!S.done['2a']; }],
  ['كتابة حرف «أ» باستخدام Shift', function(){ return !!S.done['3a']; }],
  ['استخدام Shift مع الرموز وعلامات الترقيم', function(){ return !!S.done['4a']; }],
  ['حذف حرف بمفتاح Delete', function(){ return !!S.done['2b']; }],
  ['إضافة علامة ترقيم في المكان الصحيح', function(){ return S.stars[3]; }],
  ['تعديل نص موجود دون إعادة كتابته', function(){ return S.stars[1]; }]
];
function fillPanel(){
  var total = S.attempts.reduce(function(a, b){ return a + b; }, 0);
  $('pInfo').innerHTML = '';
  var lines = [
    'المرحلة الحالية: ' + (S.bonus ? 'تحدٍّ جديد' : (S.stage + 1) + ' من 5'),
    'عدد المحاولات (كل المراحل): ' + total,
    'عدد المحاولات في المرحلة الحالية: ' + S.attempts[S.stage],
    'النجوم: ' + S.stars.filter(Boolean).length + ' من 5'
  ];
  lines.forEach(function(t){ $('pInfo').appendChild(mk('div', '', t)); });
  var ul = $('pSkills'); ul.textContent = '';
  ul.appendChild(mk('li', '', 'المهارات التي أنجزها الطالب:'));
  SKILLS.forEach(function(s){ ul.appendChild(mk('li', '', (s[1]() ? '✓ ' : '○ ') + s[0])); });
  $('pPrev').disabled = S.stage <= 0 && !S.bonus;
  $('pNext').disabled = S.stage >= 4 && !S.bonus;
}
function goStage(i){
  if(i < 0 || i > 4) return;
  S.bonus = false; S.v = 0;
  startStage(i); fillPanel();
}
$('tBtn').addEventListener('click', function(){
  var p = $('panel'); p.hidden = !p.hidden;
  if(!p.hidden) fillPanel();
  $('tBtn').blur();
});
$('pClose').addEventListener('click', function(){ $('panel').hidden = true; });
$('pPrev').addEventListener('click', function(){ goStage(S.bonus ? 3 : S.stage - 1); });
$('pNext').addEventListener('click', function(){ goStage(S.bonus ? 4 : S.stage + 1); });
$('pRepeat').addEventListener('click', function(){
  var keepBonus = S.bonus; startStage(S.stage); S.bonus = keepBonus; updateProgress(-1); fillPanel();
});
var armed = false, armTimer = null;
$('pRestart').addEventListener('click', function(){
  var b = $('pRestart');
  if(!armed){
    armed = true; b.textContent = 'اضغط مرة أخرى للتأكيد';
    armTimer = setTimeout(function(){ armed = false; b.textContent = 'إعادة تشغيل النشاط'; }, 3500);
  } else {
    clearTimeout(armTimer); armed = false; b.textContent = 'إعادة تشغيل النشاط';
    restartAll(); fillPanel();
  }
});

/* =====================================================
   تشغيل
   ===================================================== */
buildKB(kbArea, false);
buildKB($('miniKb'), true);
load();
startStage(S.stage);
window.addEventListener('resize', placeCaret);
window.addEventListener('load', placeCaret);
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(placeCaret); }

})();
</script>
</body>
</html>
